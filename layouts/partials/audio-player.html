{{ $tracks := .tracks }}
{{ $multi := gt (len $tracks) 1 }}
<section id="player-section" class="audio-player-block glass-card relative mb-16 overflow-hidden rounded-3xl border border-white/10 p-6 shadow-2xl md:p-8">
    <div class="mb-5">
        <span class="mb-0.5 block text-[10px] font-mono uppercase tracking-widest text-music">{{ .listenLabel }}</span>
        <span class="track-label font-mono text-xs text-zinc-400">{{ (index $tracks 0).label }}</span>
    </div>
    <div class="flex flex-col gap-6">
        <audio class="audio-element" preload="metadata" src="{{ (index $tracks 0).src }}"></audio>

        <div class="flex flex-col gap-2">
            <div class="audio-progress relative h-2 w-full overflow-hidden rounded-full bg-white/10">
                <div class="audio-progress-fill absolute inset-y-0 left-0 w-0 bg-music"></div>
            </div>
            <div class="flex items-center justify-between font-mono text-[11px] text-zinc-500">
                <span class="current-time">0:00</span>
                <span class="duration">0:00</span>
            </div>
        </div>

        <div class="flex flex-col items-center justify-between gap-4 border-t border-white/10 pt-4 sm:flex-row">
            <div class="flex items-center gap-4">
                <button type="button" class="play-pause flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-white text-black shadow-lg transition-transform active:scale-95" aria-label="Play / Pause">
                    <i class="fa-solid fa-play play-icon ml-0.5 text-sm"></i>
                    <i class="fa-solid fa-pause pause-icon hidden text-sm"></i>
                </button>
                <span class="text-xs font-semibold text-white">{{ .title }}</span>
            </div>
            {{ if $multi }}
                <select class="track-select w-full rounded-xl border border-white/10 bg-[#0a0a0c] px-3 py-2 font-mono text-xs text-zinc-300 focus:outline-none sm:w-auto">
                    {{ range $i, $t := $tracks }}
                        <option value="{{ $t.src }}" data-label="{{ $t.label }}"{{ if eq $i 0 }} selected{{ end }}>{{ $t.label }}</option>
                    {{ end }}
                </select>
            {{ end }}
        </div>
    </div>
</section>
